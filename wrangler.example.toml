name = "psnapi-workers"
main = "src/index.ts"
compatibility_date = "2025-09-01"

kv_namespaces = [
    { binding = "TOKEN_STORE", id = "" },
#    { binding = "PROFILES_CACHE", id = "" }, # (Optional) Used to reduce responses time
]

# Daily token renewal, and the usage check every 15 minutes (must match
# USAGE_CHECK_CRON in src/index.ts)
[triggers]
crons = ["0 12 * * *", "*/15 * * * *"]

[vars]
# (Optional) Account ID for the usage check, from `wrangler whoami`
CF_ACCOUNT_ID = ""

# Secrets are set with `wrangler secret put <NAME>`, never in this file:
# ADMIN_TOKEN = ""    # (Required) Long random string protecting POST /admin/npsso
# WEBHOOK_URL = ""    # (Optional) Webhook for expiry warnings and error alerts
# CF_API_TOKEN = ""   # (Optional) API token with "Account Analytics: Read", for the usage check
